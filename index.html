<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密验证安装</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "SF Pro Text", Arial, sans-serif;
}
body {
    background: #f5f7fa;
    padding: 20px;
}
.container {
    max-width: 420px;
    margin: 80px auto;
    background: #fff;
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
h2 {
    margin-bottom: 25px;
    color: #333;
}
.input-box {
    margin-bottom: 20px;
}
input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}
button {
    width: 100%;
    padding: 14px;
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
}
.msg {
    margin-top: 15px;
    font-weight: bold;
    height: 20px;
}
.err {
    color: red;
}
.ok {
    color: green;
}

/* 安装区域（默认隐藏） */
.install-section {
    display: none;
    margin-top: 30px;
    text-align: center;
}
.install-section h2 {
    margin-bottom: 20px;
}
.install-btn {
    font-size: 18px;
    padding: 12px 30px;
    background: #007aff;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
    <!-- 卡密验证区域 -->
    <div id="checkArea">
        <h2>请输入卡密</h2>
        <div class="input-box">
            <input id="code" placeholder="请输入卡密">
        </div>
        <button onclick="checkCode()">验证并安装</button>
        <div id="msg" class="msg"></div>
    </div>

    <!-- 安装按钮区域（验证成功后显示） -->
    <div class="install-section" id="installArea">
        <h2>点击下方安装 Filza-4.0</h2>
        <a href="itms-services://?action=download-manifest&url=https://yhl-taupe.vercel.app/yan.plist">
            <button class="install-btn">立即安装</button>
        </a>
    </div>
</div>

<script>
// 获取卡密列表
function getList() {
    return JSON.parse(localStorage.getItem("kamiList") || "[]");
}

// 保存卡密状态
function saveList(arr) {
    localStorage.setItem("kamiList", JSON.stringify(arr));
}

// 验证卡密
function checkCode() {
    let code = document.getElementById("code").value.trim();
    let list = getList();
    let now = Date.now();
    let msg = document.getElementById("msg");

    let item = list.find(x => x.code === code);

    if (!item) {
        msg.innerText = "卡密不存在";
        msg.className = "msg err";
        return;
    }
    if (item.used) {
        msg.innerText = "卡密已使用";
        msg.className = "msg err";
        return;
    }
    if (now > item.expire) {
        msg.innerText = "卡密已过期";
        msg.className = "msg err";
        return;
    }

    // 标记已使用
    item.used = true;
    saveList(list);

    msg.innerText = "验证成功！";
    msg.className = "msg ok";

    // 隐藏验证，显示安装按钮
    setTimeout(() => {
        document.getElementById("checkArea").style.display = "none";
        document.getElementById("installArea").style.display = "block";
    }, 800);
}
</script>
</body>
</html>
